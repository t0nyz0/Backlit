<svg xmlns="http://www.w3.org/2000/svg" width="806" height="300" viewBox="0 0 806 300" role="img" aria-labelledby="title desc"><title id="title">Closed lid: shut the lid, keep the light</title><desc id="desc">An illustrated lid with its light on and a 30 min label. Closed-lid lighting runs for 1 to 30 minutes.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="806" height="300" rx="28"/></clipPath></defs><rect width="806" height="300" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="48" y="92" class="eyebrow">Closed lid</text><text x="48" y="146" class="h" font-size="46" letter-spacing="-.035em">Shut the lid.</text><text x="48" y="193" class="h" font-size="46" letter-spacing="-.035em">Keep the light.</text><text x="48" y="234" class="p" font-size="17">Closed-lid lighting for 1 to 30 minutes.</text><clipPath id="l"><rect x="490" y="45" width="260" height="164" rx="12"/></clipPath><rect x="490" y="45" width="260" height="164" rx="12" fill="url(#lid)"/><rect x="490.5" y="45.5" width="259" height="163" rx="12" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#l)"><g><g><circle cx="620.0" cy="127.0" r="104.0" fill="url(#glow)"/><rect x="610.0" y="117.0" width="20" height="20" rx="5.2" fill="#fff"/></g></g></g><rect x="578.5" y="223.5" width="83" height="31" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".2"/><text x="620" y="244" class="b" font-size="15" text-anchor="middle">30 min</text></g></svg>
