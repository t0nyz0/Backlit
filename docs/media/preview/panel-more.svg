<svg xmlns="http://www.w3.org/2000/svg" width="806" height="372" viewBox="0 0 806 372" role="img" aria-labelledby="title desc"><title id="title">And the rest</title><desc id="desc">Option-click the menu bar icon to toggle the light. Your own shortcuts for toggle, brighter and dimmer. Hide the menu bar icon or the Dock icon. Launch at login. No account. Private: no audio saved, and hooks never send prompts or code. Preview mode to try the interface without the hardware. Source available to read or build.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="806" height="372" rx="28"/></clipPath></defs><rect width="806" height="372" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="48" y="86" class="h" font-size="40" letter-spacing="-.03em">And the rest.</text><text x="48.0" y="144" class="h" font-size="19" letter-spacing="-.01em">Option-click</text><text x="48.0" y="170" class="s" font-size="15">Toggle the light</text><text x="48.0" y="191" class="s" font-size="15">from the menu bar</text><text x="48.0" y="212" class="s" font-size="15">icon.</text><text x="231.5" y="144" class="h" font-size="19" letter-spacing="-.01em">Your shortcuts</text><text x="231.5" y="170" class="s" font-size="15">Toggle, brighter,</text><text x="231.5" y="191" class="s" font-size="15">dimmer. Set your</text><text x="231.5" y="212" class="s" font-size="15">own keys.</text><text x="415.0" y="144" class="h" font-size="19" letter-spacing="-.01em">Out of the way</text><text x="415.0" y="170" class="s" font-size="15">Hide the menu bar</text><text x="415.0" y="191" class="s" font-size="15">icon or the Dock</text><text x="415.0" y="212" class="s" font-size="15">icon.</text><text x="598.5" y="144" class="h" font-size="19" letter-spacing="-.01em">Launch at login</text><text x="598.5" y="170" class="s" font-size="15">Ready when your</text><text x="598.5" y="191" class="s" font-size="15">Mac starts.</text><text x="48.0" y="262" class="h" font-size="19" letter-spacing="-.01em">No account</text><text x="48.0" y="288" class="s" font-size="15">Nothing to sign</text><text x="48.0" y="309" class="s" font-size="15">up for.</text><text x="231.5" y="262" class="h" font-size="19" letter-spacing="-.01em">Private</text><text x="231.5" y="288" class="s" font-size="15">No audio saved.</text><text x="231.5" y="309" class="s" font-size="15">Hooks never send</text><text x="231.5" y="330" class="s" font-size="15">prompts or code.</text><text x="415.0" y="262" class="h" font-size="19" letter-spacing="-.01em">Preview mode</text><text x="415.0" y="288" class="s" font-size="15">Try the interface</text><text x="415.0" y="309" class="s" font-size="15">without the</text><text x="415.0" y="330" class="s" font-size="15">hardware.</text><text x="598.5" y="262" class="h" font-size="19" letter-spacing="-.01em">Source available</text><text x="598.5" y="288" class="s" font-size="15">Read it, or build</text><text x="598.5" y="309" class="s" font-size="15">it yourself.</text></g></svg>
