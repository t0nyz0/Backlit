<svg xmlns="http://www.w3.org/2000/svg" width="806" height="240" viewBox="0 0 806 240" role="img" aria-labelledby="title desc"><title id="title">Seven ways to light up</title><desc id="desc">Seven illustrated lids, one for each behavior: Steady, Breathe, Battery, Music, Agents, Trackpad and Typing.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="806" height="240" rx="28"/></clipPath></defs><rect width="806" height="240" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="48" y="78" class="h" font-size="36" letter-spacing="-.03em">Seven ways to light up.</text><clipPath id="m0"><rect x="48.0" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="48.0" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="48.5" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m0)"><g><g><circle cx="92.715" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="87.715" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="48.0" y="197" class="b" font-size="15">Steady</text><clipPath id="m1"><rect x="151.43" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="151.43" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="151.93" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m1)"><g><g class="breathe"><circle cx="196.145" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="191.145" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="151.43" y="197" class="b" font-size="15">Breathe</text><clipPath id="m2"><rect x="254.86" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="254.86" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="255.36" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m2)"><g opacity="0.45"><g><circle cx="299.57500000000005" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="294.57500000000005" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="254.86" y="197" class="b" font-size="15">Battery</text><clipPath id="m3"><rect x="358.29" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="358.29" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="358.79" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m3)"><g><g class="beat"><circle cx="403.005" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="398.005" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="358.29" y="197" class="b" font-size="15">Music</text><clipPath id="m4"><rect x="461.71" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="461.71" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="462.21" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m4)"><g><g class="beat" style="animation-duration:2.2s"><circle cx="506.42499999999995" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="501.42499999999995" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="461.71" y="197" class="b" font-size="15">Agents</text><clipPath id="m5"><rect x="565.14" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="565.14" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="565.64" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m5)"><g opacity="0.75"><g><circle cx="609.855" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="604.855" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="565.14" y="197" class="b" font-size="15">Trackpad</text><clipPath id="m6"><rect x="668.57" y="116" width="89.43" height="56" rx="7"/></clipPath><rect x="668.57" y="116" width="89.43" height="56" rx="7" fill="url(#lid)"/><rect x="669.07" y="116.5" width="88.43" height="55" rx="7" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#m6)"><g><g class="beat" style="animation-duration:.6s"><circle cx="713.2850000000001" cy="144.0" r="52.0" fill="url(#glow)"/><rect x="708.2850000000001" y="139.0" width="10" height="10" rx="2.6" fill="#fff"/></g></g></g><text x="668.57" y="197" class="b" font-size="15">Typing</text></g></svg>
