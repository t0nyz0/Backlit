<svg xmlns="http://www.w3.org/2000/svg" width="806" height="472" viewBox="0 0 806 472" role="img" aria-labelledby="title desc"><title id="title">Connections: fits your setup</title><desc id="desc">Four connections. Claude Code and Codex: status hooks light the logo while your agent works. Home Assistant: a local light and status sensors, no cloud needed. MCP: local AI assistants can read the light, or change it if you allow. Stream Deck: put the light on a key, an experimental add-on.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.breathe,.beat,.eq{animation:none}}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="806" height="472" rx="28"/></clipPath></defs><rect width="806" height="472" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="48" y="58" class="eyebrow">Connections</text><text x="48" y="106" class="h" font-size="40" letter-spacing="-.03em">Fits your setup.</text><rect x="48" y="134" width="348" height="140" rx="20" fill="#1c1c1e"/><text x="74" y="184" class="h" font-size="26" letter-spacing="-.02em">Claude Code and Codex</text><text x="74" y="216" class="s" font-size="17">Status hooks light the logo while</text><text x="74" y="240" class="s" font-size="17">your agent works.</text><rect x="410" y="134" width="348" height="140" rx="20" fill="#1c1c1e"/><text x="436" y="184" class="h" font-size="26" letter-spacing="-.02em">Home Assistant</text><text x="436" y="216" class="s" font-size="17">A local light and status sensors.</text><text x="436" y="240" class="s" font-size="17">No cloud needed.</text><rect x="48" y="288" width="348" height="140" rx="20" fill="#1c1c1e"/><text x="74" y="338" class="h" font-size="26" letter-spacing="-.02em">MCP</text><text x="74" y="370" class="s" font-size="17">Local AI assistants can read the</text><text x="74" y="394" class="s" font-size="17">light, or change it if you allow.</text><rect x="410" y="288" width="348" height="140" rx="20" fill="#1c1c1e"/><text x="436" y="338" class="h" font-size="26" letter-spacing="-.02em">Stream Deck</text><text x="436" y="370" class="s" font-size="17">Put the light on a key.</text><text x="436" y="394" class="s" font-size="17">Experimental add-on.</text></g></svg>
