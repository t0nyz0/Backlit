<svg xmlns="http://www.w3.org/2000/svg" width="806" height="225" viewBox="0 0 806 225" role="img" aria-labelledby="title desc">
<title id="title">Control Center</title><desc id="desc">Add Logo Light to your controls. No need to open Backlit’s window. Requires macOS 27 or later with Backlit running. Illustration of the Logo Light control.</desc>
<defs><linearGradient id="surface" x2="0" y2="1"><stop stop-color="#252529"/><stop offset="1" stop-color="#171719"/></linearGradient><linearGradient id="toggle" x2="0" y2="1"><stop stop-color="#414148"/><stop offset="1" stop-color="#313138"/></linearGradient></defs>
<rect width="806" height="225" rx="28" fill="#000"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="46" y="88" fill="#f5f5f7" font-size="46" font-weight="700" letter-spacing="-1.5">Control Center</text>
<text x="48" y="126" fill="#a1a1a6" font-size="18">Add Logo Light to your controls.</text>
<text x="48" y="150" fill="#a1a1a6" font-size="18">No need to open Backlit’s window.</text>
<text x="48" y="184" fill="#a1a1a6" font-size="14">macOS 27 or later · Backlit must be running</text>
<rect x="498" y="49" width="251" height="127" rx="24" fill="url(#surface)" stroke="#404045"/>
<rect x="516" y="67" width="215" height="91" rx="20" fill="url(#toggle)" stroke="#53535b"/>
<circle cx="555" cy="112.5" r="23" fill="#f4f4f6"/>
<path d="M549 116a6 6 0 1 1 12 0m-6-15v4m-9 .5 3 3m15-3-3 3m-15 12h18m-14 4h10" fill="none" stroke="#26262c" stroke-width="1.85" stroke-linecap="round"/>
<text x="590" y="109" fill="#f5f5f7" font-size="18" font-weight="650">Logo Light</text>
<text x="590" y="132" fill="#c7c7cc" font-size="14">On</text>
</g></svg>
