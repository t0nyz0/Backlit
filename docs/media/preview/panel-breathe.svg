<svg xmlns="http://www.w3.org/2000/svg" width="806" height="340" viewBox="0 0 806 340" role="img" aria-labelledby="title desc"><title id="title">Breathe: a slow, quiet pulse</title><desc id="desc">An illustrated lid whose light fades in and out. Breathe runs on a 3 to 30 second cycle, and you set the brightness and how low it dims.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="806" height="340" rx="28"/></clipPath></defs><rect width="806" height="340" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="48" y="103" class="eyebrow">Breathe</text><text x="48" y="160" class="h" font-size="50" letter-spacing="-.035em">A slow,</text><text x="48" y="211" class="h" font-size="50" letter-spacing="-.035em">quiet pulse.</text><text x="48" y="252" class="p" font-size="17">A 3 to 30 second cycle. You set the</text><text x="48" y="276" class="p" font-size="17">brightness and how low it dims.</text><clipPath id="l"><rect x="450" y="75" width="300" height="190" rx="14"/></clipPath><rect x="450" y="75" width="300" height="190" rx="14" fill="url(#lid)"/><rect x="450.5" y="75.5" width="299" height="189" rx="14" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#l)"><g><g class="breathe"><circle cx="600.0" cy="170.0" r="124.80000000000001" fill="url(#glow)"/><rect x="588.0" y="158.0" width="24" height="24" rx="6.24" fill="#fff"/></g></g></g></g></svg>
