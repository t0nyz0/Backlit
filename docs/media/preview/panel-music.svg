<svg xmlns="http://www.w3.org/2000/svg" width="395" height="420" viewBox="0 0 395 420" role="img" aria-labelledby="title desc"><title id="title">Music: it moves with the bass</title><desc id="desc">An illustrated lid whose light flashes on each bass hit, above a moving level meter. Music follows whatever your Mac is playing, with Smooth, Balanced or Punchy response, and never uses the microphone.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="395" height="420" rx="28"/></clipPath></defs><rect width="395" height="420" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="36" y="50" class="eyebrow">Music</text><text x="36" y="91" class="h" font-size="32" letter-spacing="-.03em">It moves with the</text><text x="36" y="126" class="h" font-size="32" letter-spacing="-.03em">bass.</text><text x="36" y="158" class="p" font-size="16">Follows whatever your Mac is playing.</text><text x="36" y="180" class="p" font-size="16">Smooth, Balanced or Punchy.</text><text x="36" y="202" class="p" font-size="16">No microphone.</text><clipPath id="l"><rect x="92.5" y="216" width="210" height="132" rx="10"/></clipPath><rect x="92.5" y="216" width="210" height="132" rx="10" fill="url(#lid)"/><rect x="93.0" y="216.5" width="209" height="131" rx="10" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#l)"><g><g class="beat"><circle cx="197.5" cy="282.0" r="88.4" fill="url(#glow)"/><rect x="189.0" y="273.5" width="17" height="17" rx="4.42" fill="#fff"/></g></g></g><rect class="eq" style="animation-delay:-0.1s" x="116" y="374" width="7" height="14" rx="3" fill="#ffffff"/><rect class="eq" style="animation-delay:-0.5s" x="128" y="364" width="7" height="24" rx="3" fill="#ffffff"/><rect class="eq" style="animation-delay:-0.9s" x="140" y="370" width="7" height="18" rx="3" fill="#ffffff"/><rect class="eq" style="animation-delay:-0.3s" x="152" y="362" width="7" height="26" rx="3" fill="#ffffff"/><rect class="eq" style="animation-delay:-0.7s" x="164" y="372" width="7" height="16" rx="3" fill="#ffffff"/><rect class="eq" style="animation-delay:-0.2s" x="176" y="366" width="7" height="22" rx="3" fill="#a1a1a6"/><rect class="eq" style="animation-delay:-0.6s" x="188" y="376" width="7" height="12" rx="3" fill="#a1a1a6"/><rect class="eq" style="animation-delay:-1s" x="200" y="370" width="7" height="18" rx="3" fill="#a1a1a6"/><rect class="eq" style="animation-delay:-0.4s" x="212" y="378" width="7" height="10" rx="3" fill="#a1a1a6"/><rect class="eq" style="animation-delay:-0.8s" x="224" y="368" width="7" height="20" rx="3" fill="#6e6e73"/><rect class="eq" style="animation-delay:-0.15s" x="236" y="375" width="7" height="13" rx="3" fill="#6e6e73"/><rect class="eq" style="animation-delay:-0.55s" x="248" y="380" width="7" height="8" rx="3" fill="#6e6e73"/><rect class="eq" style="animation-delay:-0.95s" x="260" y="372" width="7" height="16" rx="3" fill="#6e6e73"/><rect class="eq" style="animation-delay:-0.35s" x="272" y="377" width="7" height="11" rx="3" fill="#6e6e73"/></g></svg>
