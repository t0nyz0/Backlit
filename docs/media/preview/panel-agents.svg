<svg xmlns="http://www.w3.org/2000/svg" width="395" height="420" viewBox="0 0 395 420" role="img" aria-labelledby="title desc"><title id="title">Agents: know when your agent needs you</title><desc id="desc">An illustrated lid whose light pulses beside a status reading “Claude Code is waiting for you”. Agents shows working, waiting and attention states for Claude Code and Codex.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:15px;font-weight:600;fill:#a1a1a6}
.h{font-weight:700;fill:#f5f5f7}
.p{fill:#a1a1a6}
.s{fill:#c7c7cc}
.b{font-weight:600;fill:#f5f5f7}
@keyframes breathe{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes beat{0%,100%{opacity:.2}8%{opacity:1}34%{opacity:.2}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.beat{animation:beat 1.1s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
</style><defs>
<linearGradient id="lid" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#2c2c2f"/><stop offset=".5" stop-color="#171719"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".2" stop-color="#fff" stop-opacity=".27"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="panel"><rect width="395" height="420" rx="28"/></clipPath></defs><rect width="395" height="420" rx="28" fill="#000"/><g clip-path="url(#panel)"><text x="36" y="50" class="eyebrow">Agents</text><text x="36" y="91" class="h" font-size="32" letter-spacing="-.03em">Know when your</text><text x="36" y="126" class="h" font-size="32" letter-spacing="-.03em">agent needs you.</text><text x="36" y="158" class="p" font-size="16">Working, waiting, or asking for you.</text><text x="36" y="180" class="p" font-size="16">For Claude Code and Codex.</text><clipPath id="l"><rect x="92.5" y="208" width="210" height="132" rx="10"/></clipPath><rect x="92.5" y="208" width="210" height="132" rx="10" fill="url(#lid)"/><rect x="93.0" y="208.5" width="209" height="131" rx="10" fill="none" stroke="#fff" stroke-opacity=".09"/><g clip-path="url(#l)"><g><g class="beat" style="animation-duration:2.2s"><circle cx="197.5" cy="274.0" r="88.4" fill="url(#glow)"/><rect x="189.0" y="265.5" width="17" height="17" rx="4.42" fill="#fff"/></g></g></g><rect x="72.5" y="352" width="250" height="36" rx="18" fill="#1c1c1e"/><rect x="73" y="352.5" width="249" height="35" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".1"/><rect class="beat" style="animation-duration:2.2s" x="88" y="366" width="8" height="8" rx="2.5" fill="#fff"/><text x="106" y="375" class="b" font-size="14">Claude Code is waiting for you</text></g></svg>
