name: Build and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Privacy and secret checks
        run: |
          python3 scripts/check_privacy.py
          brew install gitleaks
          gitleaks git --log-opts=--all --redact --no-banner .
      - name: Native tests
        run: swift test
      - name: Home Assistant client and Core tests
        run: |
          python -m pip install -r Tests/Python/requirements-ci.txt
          python -m unittest discover -s Tests/Python -v
      - name: Documentation and media checks
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_media.py
          git diff --exit-code
      - name: Compile and package app
        run: |
          bash scripts/build.sh
          bash scripts/package.sh
      - name: Upload compiled packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backlit-macos-arm64
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested build and publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n backlit-macos-arm64 -D dist/packages
          gh release create "$GITHUB_REF_NAME" dist/packages/* --verify-tag --prerelease --title "Backlit $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
