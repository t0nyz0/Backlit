name: Update download chart
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: downloads-chart
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 't0nyz0/Backlit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and refresh public asset counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s Tests/Python -p test_downloads_chart.py -v
          python3 scripts/update_downloads.py
          python3 scripts/update_downloads.py --check
      - name: Publish only chart and snapshot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/downloads/latest.json docs/downloads/snapshots/ docs/media/downloads.svg
          git diff --cached --quiet && exit 0
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              docs/downloads/latest.json|docs/downloads/snapshots/*.json|docs/media/downloads.svg) ;;
              *) echo "Unexpected staged path" >&2; exit 1 ;;
            esac
          done
          git commit -m 'Refresh app download snapshot [skip ci]'
          # Credentials are ephemeral and never persisted in the checkout.
          # A concurrent main update causes a safe non-fast-forward failure;
          # never force-push or overwrite another change.
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/main
